<!DOCTYPE html>
<html>

<head>
    <title>Contact Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container py-5">
        <h1 class="text-center">Contact Us</h1>
        <p class="text-center">Feel free to reach out to us with any questions or feedback!</p>

        <form id="contact_form" class="row g-3 mb-4 text-center" novalidate>
            <div class="col-12 col-md-6">
                <label for="contact_name" class="form-label">Name</label>
                <input id="contact_name" class="form-control" type="text" required>
            </div>
            <div class="col-12 col-md-6">
                <label for="contact_email" class="form-label">Email</label>
                <input id="contact_email" class="form-control" type="email" required>
            </div>
            <div class="col-12">
                <label for="contact_subject" class="form-label">Subject</label>
                <input id="contact_subject" class="form-control" type="text" required>
            </div>
            <div class="col-12">
                <label for="contact_message" class="form-label">Message</label>
                <textarea id="contact_message" class="form-control" rows="4" required></textarea>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Send Message</button>
            </div>
        </form>

        <div id="google_maps" class="ratio ratio-16x9 mb-4">
            <iframe
                src="https://www.google.com/maps?q=Athens%2C%20Greece&output=embed"
                title="Google Maps location"
                style="border:0;"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </div>
        <div id="social_media_links" class="d-flex flex-column flex-sm-row gap-3">
            <a href="https://www.facebook.com/TechNest" target="_blank">Facebook</a>
            <a href="https://www.twitter.com/TechNest" target="_blank">Twitter</a>
            <a href="https://www.instagram.com/TechNest" target="_blank">Instagram</a>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/contact.js"></script>
</body>

</html>
