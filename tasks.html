<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <main class="container py-5">
        <div id="task_creation" class="row g-3">
            <div class="col-12 col-md-4">
                <input id="task_name" class="form-control" type="text" placeholder="enter task name">
            </div>
            <div class="col-12 col-md-4">
                <input id="task_description" class="form-control" type="text" placeholder="enter task description">
            </div>
            <div class="col-12 col-md-4">
                <input id="task_due_date" class="form-control" type="date" placeholder="enter due date">
            </div>
            <div class="col-12">
                <button id="add_task_button" class="btn btn-primary" type="button">Add Task</button>
            </div>
        </div>
        <div class="row g-3 mt-3">
            <div class="col-12 col-md-6">
                <select id="status_filter" class="form-select">
                    <option value="all">All tasks</option>
                    <option value="pending">Pending tasks</option>
                    <option value="completed">Completed tasks</option>
                </select>
            </div>
            <div class="col-12 col-md-6">
                <select id="task_sort" class="form-select">
                    <option value="">Sort tasks</option>
                    <option value="name">Task name</option>
                    <option value="dueDate">Due date</option>
                </select>
            </div>
        </div>
        <div id="task_display" class="row g-3 mt-4"></div>
        <div id="task_analytics" class="row g-3 mt-4"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/tasks.js"></script>
</body>

</html>
